{% extends "base.html" %}

{% block title %}Вход — ДАР-Скрин{% endblock %}

{% block content %}
<section class="login-panel">
  <h1>Вход</h1>
  <p class="hint">Войдите под своей учётной записью.</p>

  {% if form.errors %}
    <p class="form-error">Неверный логин или пароль. Попробуйте ещё раз.</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}" class="login-form">
    {% csrf_token %}
    <label for="id_username">Логин</label>
    <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>

    <label for="id_password">Пароль</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>

    {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}
